{flex:1;font-size:13px;font-weight:600}.lane-update-notice button{cursor:pointer;border:0;border-radius:9px;padding:8px 10px;background:var(--primary,#4C6EF5);color:white;font-weight:700}.lane-update-notice button:last-child{background:transparent;color:inherit}@media(min-width:850px){.lane-update-notice{bottom:24px}}

const KEY='lane_os_v1';const pad=n=>String(n).padStart(2,'0');const toLocalDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const today=()=>toLocalDate(new Date());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,6);const dayName=d=>new Date(d+'T12:00:00').toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'});const dAdd=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return toLocalDate(x)};const initial=()=>({name:'Noa',tasks:[],events:[],swims:[],wellness:[],subjects:[{id:uid(),name:'Programmeren',color:'#a598ff'},{id:uid(),name:'Databanken',color:'#56e4db'},{id:uid(),name:'Webdevelopment',color:'#ffcc78'}],goalSessions:8,goalStudy:12,focus:25});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}for(const key of ['tasks','events','swims','wellness','subjects'])if(!Array.isArray(data[key]))data[key]=[];if(!data.athlete){data.athlete={vo2max:79.6, vlamax:0.73, main:'200 m schoolslag', secondary:'400 m wisselslag', club:'BRABO Kernploeg', sessions:8, weeklyKm:40, personalBests:[['50 school (25m)','29,86'],['100 school (25m)','1:04,96'],['200 school (25m)','2:16,19'],['200 school (50m)','2:19,30'],['400 wissel (25m)','4:38,42'],['400 wissel (50m)','4:35,24']],splits:['31,48','35,82','36,15','35,85']};try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn(e)}}let page='dashboard';const nav=[['dashboard','◈','Dashboard'],['planning','▦','Planning'],['tasks','✓','Taken'],['swimming','≋','Zwemmen'],['importer','⇧','Importeren'],['performance','◉','Performance'],['study','⌘','Studie'],['recovery','♡','Herstel'],['settings','⚙','Instellingen']];const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render();queueCloudSave()};const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)};const monday=()=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return toLocalDate(d)};const weekDates=()=>Array.from({length:7},(_,i)=>dAdd(monday(),i));const withinWeek=date=>date>=monday()&&date<=dAdd(monday(),6);const swimWeek=()=>data.swims.filter(x=>withinWeek(x.date));const plannedSwimWeek=()=>data.events.filter(x=>x.type==='swim'&&withinWeek(x.date));const plannedMetersWeek=()=>plannedSwimWeek().reduce((a,x)=>a+(Number(x.meters)||0),0);const studyWeek=()=>data.events.filter(x=>x.type==='study'&&withinWeek(x.date)).reduce((a,x)=>a+(Number(x.duration)||0)/60,0);const dueTasks=()=>data.tasks.filter(t=>!t.done&&t.date<=today()).sort((a,b)=>a.date.localeCompare(b.date));const completion=()=>data.tasks.length?Math.round(data.tasks.filter(t=>t.done).length/data.tasks.length*100):0;const latestRecovery=()=>[...data.wellness].sort((a,b)=>b.date.localeCompare(a.date))[0];const eRows=(items,limit=20)=>items.slice(0,limit).map(e=>`<div class="scheduleitem ${e.type==='study'?'study':e.type==='other'?'other':''}"><span class="time">${esc(e.time||'—')}</span><div><div class="itemtitle">${esc(e.title)}</div><div class="itemsub">${e.type==='swim'?'🏊 Zwemmen':e.type==='study'?'📚 Studie':'📍 Overig'}${e.duration?' · '+esc(e.duration)+' min':''}${e.type==='swim'&&e.meters?' · '+Number(e.meters).toLocaleString('nl-BE')+' m':''}${e.zone?' · '+esc(e.zone):''}${e.location?' · '+esc(e.location):''}</div></div></div>`).join('');const sortedEvents=()=>[...data.events].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));function setPage(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){const dateLabel=new Date().toLocaleDateString('nl-BE',{day:'numeric',month:'short',year:'numeric'});document.getElementById('todayDate').textContent='◷ '+dateLabel;const accountButton=document.getElementById('laneAccountBtn');if(accountButton)accountButton.textContent=cloudUser?'☁ '+(cloudUser.email||'Account'):'☁ Inloggen';document.getElementById('subtitle').textContent=page==='dashboard'?'Eén plek voor prestaties, focus en balans.':'Maak elke dag een beetje sterker.';const names={dashboard:'Jouw dagen, jouw progressie.',planning:'Jouw kalender en geschiedenis.',tasks:'Actie geeft momentum.',swimming:'Train met intentie.',importer:'Importeer je trainingsweek.',performance:'Jouw performance lab.',study:'Bouw aan je toekomst.',recovery:'Herstel is progressie.',settings:'Jouw cockpit.'};document.getElementById('pagetitle').textContent=names[page];document.getElementById('eyebrow').textContent=page==='dashboard'?'JOUW COMMAND CENTER':nav.find(n=>n[0]===page)[2].toUpperCase();for(const [id,el] of [['desktopNav',''],['mobileNav','']])document.getElementById(id).innerHTML=nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="setPage('${n[0]}')"><span class="${id==='desktopNav'?'ico':''}">${n[1]}</span>${n[2]}</button>`).join('');document.getElementById('content').innerHTML=({dashboard,planning,tasks,swimming,importer,performance,study,recovery,settings})[page]()}function laneOldDashboard(){const events=sortedEvents().filter(e=>e.date===today());const pending=data.tasks.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date));const rec=latestRecovery();return `<div class="grid metrics"><div class="card"><div class="statlabel">🏊 Zwemsessies deze week</div><div class="statvalue cyan">${swimWeek().length}<span style="font-size:16px;color:#8fa0bb"> / ${data.goalSessions}</span></div><div class="statfoot">${swimWeek().reduce((a,x)=>a+Number(x.distance),0).toLocaleString('nl-BE')} meter gezwommen${plannedMetersWeek()?` · ${plannedMetersWeek().toLocaleString('nl-BE')} m gepland`:''}</div></div><div class="card"><div class="statlabel">📚 Studie deze week</div><div class="statvalue purple">${studyWeek().toFixed(1).replace('.',',')}<span style="font-size:16px;color:#8fa0bb"> u</span></div><div class="statfoot">Weekdoel: ${data.goalStudy} uur (geplande blokken)</div></div><div class="card"><div class="statlabel">✅ Taken afgerond</div><div class="statvalue">${completion()}%</div><div class="statfoot">${data.tasks.filter(x=>x.done).length} van ${data.tasks.length} totaal</div></div><div class="card"><div class="statlabel">⚡ Openstaande deadlines</div><div class="statvalue yellow">${dueTasks().length}</div><div class="statfoot">Vandaag of achterstallig</div></div></div><div class="grid twocol"><div class="card"><div class="cardtop"><h2>📅 Vandaag · ${esc(dayName(today()))}</h2><button class="miniBtn" onclick="openForm('event')">+ Blok</button></div>${events.length?eRows(events):'<div class="empty">Nog geen blokken gepland. Plan je eerste trainings- of studiesessie.</div>'}</div><div class="card"><div class="cardtop"><h2>🎯 Eerstvolgende taken</h2><button class="miniBtn" onclick="openForm('task')">+ Taak</button></div>${pending.length?taskRows(pending.slice(0,6)):'<div class="empty">Alles afgevinkt of nog geen taken toegevoegd.</div>'}<div class="progress"><div style="width:${completion()}%"></div></div></div></div><div class="grid twocol" style="margin-top:17px"><div class="card"><div class="cardtop"><h2>📈 Je week in één oogopslag</h2><span class="small muted">ma–zo</span></div>${weekStrip()}<div class="note" style="margin-top:18px">💡 <b>Consistency beats intensity.</b> Een haalbare planning met ruimte voor herstel is sterker dan een volle agenda.</div></div><div class="card"><div class="cardtop"><h2>🫀 Herstelcheck</h2><button class="miniBtn" onclick="openForm('wellness')">+ Check-in</button></div>${rec?`<div class="recovery"><div class="tile"><span>Slaap (laatste check-in)</span><b>${esc(rec.sleep)} u</b></div><div class="tile"><span>Energie</span><b>${esc(rec.energy)}/10</b></div><div class="tile"><span>Spiervermoeidheid</span><b>${esc(rec.soreness)}/10</b></div><div class="tile"><span>Stress</span><b>${esc(rec.stress)}/10</b></div></div><p class="small muted">Geregistreerd op ${esc(dayName(rec.date))}</p>`:'<div class="empty">Hoe voel je je vandaag? Leg je slaap, energie en herstel vast.</div>'}</div></div>`}function weekStrip(){return `<div class="week">${weekDates().map(d=>{const count=data.events.filter(x=>x.date===d).length+data.swims.filter(x=>x.date===d).length;return `<div class="day ${d===today()?'today':''}"><small>${new Date(d+'T12:00:00').toLocaleDateString('nl-BE',{weekday:'short'})}</small><strong>${d.slice(8)}</strong><small>${count} item${count===1?'':'s'}</small><div class="dot ${count?'filled':''}"></div></div>`}).join('')}</div>`}function taskRows(items){return items.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="Taak afronden" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div style="flex:1"><div class="itemtitle">${esc(t.title)}<span class="chip">${esc(t.category)}${t.subjectId ? ' · '+esc(laneSubjectName(t.subjectId)) : ''}</span></div><div class="taskmeta">${esc(dayName(t.date))} · ${esc(t.priority)} prioriteit</div></div><button class="miniBtn" title="Verwijderen" onclick="removeItem('tasks','${t.id}')">✕</button></div>`).join('')}function laneOldPlanning(){const days=weekDates();return `<div class="sectionbar"><h2>Weekoverzicht</h2><button class="btn primary" onclick="openForm('event')">+ Plan een blok</button></div><div class="card">${weekStrip()}</div><div class="sectionbar"><h2>Alle geplande blokken</h2></div><div class="card listcard">${sortedEvents().length?sortedEvents().map(e=>`<div class="rowitem"><div><span class="subheading">${esc(e.title)}</span><div class="itemsub">${esc(dayName(e.date))} · ${esc(e.time)} · ${esc(e.type)}${e.duration?' · '+esc(e.duration)+' min':''}${e.type==='swim'&&e.meters?' · '+Number(e.meters).toLocaleString('nl-BE')+' m':''}${e.zone?' · '+esc(e.zone):''}</div></div><button class="miniBtn" onclick="removeItem('events','${e.id}')">Verwijder</button></div>`).join(''):'<div class="empty">Nog niets gepland.</div>'}</div>`}function laneOldTasks(){const active=[...data.tasks].sort((a,b)=>a.done-b.done||a.date.localeCompare(b.date));return `<div class="sectionbar"><h2>${data.tasks.filter(t=>!t.done).length} openstaande taken</h2><button class="btn primary" onclick="openForm('task')">+ Nieuwe taak</button></div><div class="grid twocol"><div class="card"><h2>Jouw actielijst</h2>${active.length?taskRows(active):'<div class="empty">Voeg je eerste taak toe. Start klein.</div>'}</div><div class="card"><h2>Taakvoortgang</h2><div class="statvalue cyan">${completion()}%</div><p class="muted">Afgerond over alle taken</p><div class="progress"><div style="width:${completion()}%"></div></div><p class="small muted">Tip: kies dagelijks maximaal drie belangrijke taken.</p></div></div>`}function openSwimUpload(){setPage('importer');document.getElementById('trainingFile')?.click()}function swimming(){const total=data.swims.reduce((a,x)=>a+Number(x.distance),0);const swims=[...data.swims].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="grid metrics"><div class="card"><div class="statlabel">Deze week</div><div class="statvalue cyan">${swimWeek().length}</div><div class="statfoot">sessies</div></div><div class="card"><div class="statlabel">Deze week</div><div class="statvalue">${swimWeek().reduce((a,x)=>a+Number(x.distance),0).toLocaleString('nl-BE')}</div><div class="statfoot">meters</div></div><div class="card"><div class="statlabel">Totaal gelogd</div><div class="statvalue purple">${total.toLocaleString('nl-BE')}</div><div class="statfoot">meters</div></div><div class="card"><div class="statlabel">Gepland deze week</div><div class="statvalue yellow">${plannedMetersWeek()?plannedMetersWeek().toLocaleString('nl-BE'):'—'}</div><div class="statfoot">meters uit geïmporteerde weekplanning</div></div></div><div class="uploadHero"><div class="heroCopy"><img src="icons/icon-192.png" alt="LANE icoon"><div class="heroCopyText"><h2>📄 Trainingsweek automatisch inladen</h2><p>Upload een PDF, Word- of tekstdocument van je coach. LANE probeert per tr "card"><div class="statlabel">Primair doel</div><div class="statvalue yellow" style="font-size:24px">200 school</div><div class="statfoot">Korte baan / lange baan</div></div></div><div class="grid twocol"><div class="card"><div class="cardtop"><h2>🏅 Persoonlijke records</h2><span class="small muted">Op basis van eerder gesprek</span></div>${prs.map(p=>`<div class="rowitem"><div class="subheading">${esc(p[0])}</div><b style="color:var(--cyan)">${esc(p[1])}</b></div>`).join('')}</div><div class="card"><h2>📊 Analyse 200 m schoolslag</h2><p class="muted small">Eerder gedeelde 50 m-tussentijden. Controleer zelf of deze bij de juiste wedstrijd horen.</p><div class="splitChart">${splits.map((s,i)=>`<div class="splitRow"><span>${i+1}e 50</span><div class="barTrack"><div class="barFill" style="width:${Math.min(100,parseFloat(s.replace(',','.'))/40*100)}%"></div></div><b>${esc(s)} s</b></div>`).join('')}</div><div class="note">De derde 50 m verdient aandacht bij wedstrijdanalyse. Gebruik splits samen met je eigen gevoel en feedback van je trainer; er volgt hier geen automatische fysiologische diagnose uit.</div></div></div><div class="grid twocol" style="margin-top:17px"><div class="card"><h2>🏁 Wedstrijdweek · 7–8 november</h2><div class="scheduleitem"><span class="time">Za 7</span><div><div class="itemtitle">400 m wisselslag</div><div class="itemsub">Voorrondes en mogelijke finale</div></div></div><div class="scheduleitem"><span class="time">Zo 8</span><div><div class="itemtitle">200 m schoolslag</div><div class="itemsub">Voorrondes en mogelijke finale</div></div></div><p class="small muted">Dit is wedstrijdcontext, geen definitief startuur of officiële inschrijving.</p></div><div class="card"><h2>⚙️ Profiel bijwerken</h2><form class="inputrow" onsubmit="saveAthlete(event)"><label class="field">VO₂max<input name="vo2max" type="number" step="0.01" min="0" value="${esc(a.vo2max)}"></label><label class="field">VLamax<input name="vlamax" type="number" step="0.01" min="0" value=" function importer(){return `<div class="grid twocol"><div class="card"><div class="laneBadge"><img src="icons/icon-192.png" alt="LANE icoon"><span>BRABO trainingsimport</span></div><h2 style="margin-top:14px">📄 Trainingsweek importeren</h2><p class="muted">Upload het schema van je coach als <b>PDF</b>, <b>Word (.docx)</b> of <b>tekstbestand (.txt)</b>. LANE herkent per pagina datum, ochtend/avond, meters, minuten en trainingszone (AEC1, AEC1+, AEC2, AEC3, ANC, ANP). Voor jouw schema gebruikt LANE bij PDF’s extra logica: <b>pagina 1 = weekoverzicht</b>, volgende pagina’s = <b>individuele trainingen</b>. Onderaan elke trainingspagina zoekt het systeem vooral naar <b>minuten</b> en <b>totale meters</b>.</p><label class="importDrop" id="importDrop"><span style="font-size:36px">📁</span><strong>Kies je trainingsbestand</strong><span class="small muted">PDF · DOCX · TXT · maximaal 15 MB</span><input id="trainingFile" type="file" accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" onchange="loadTrainingFile(event)"></label><div class="inputrow" style="margin-top:16px"><label class="field">Maandag van de trainingsweek<input id="importMonday" type="date" value="${monday()}"></label><label class="field">Standaard starttijd<input id="importDefaultTime" type="time" value="06:00"></label><label class="field">Standaardduur (minuten)<input id="importDuration" type="number" value="90" min="10" max="240"></label><label class="field">Voorblad is weekoverzicht<input id="importCoverPage" type="checkbox" checked></label></div><div class="importSummary">${importSummaryTiles()}</div><p class="importMsg" id="importStatus">Documenten worden in je browser verwerkt. Er wordt niets naar een LANE-server verstuurd. Voor PDF- en DOCX-verwerking wordt bij het eerste gebruik een externe softwarebibliotheek geladen.</p><div class="importHint">💡 Tip: als de dag of starttijd niet perfect wordt gelezen, kun je die nog manueel aanpas function importSummaryTiles(){const rows=importRows.filter(r=>r.selected);const totalMeters=rows.reduce((a,r)=>a+(Number(r.meters)||0),0);const totalMinutes=rows.reduce((a,r)=>a+(Number(r.duration)||0),0);return `<div class="summaryTile"><div class="label">Voorgesteld</div><div class="value">${importRows.length||0}</div></div><div class="summaryTile"><div class="label">Meters</div><div class="value">${totalMeters?totalMeters.toLocaleString('nl-BE'):'—'}</div></div><div class="summaryTile"><div class="label">Minuten</div><div class="value">${totalMinutes||'—'}</div></div><div class="summaryTile"><div class="label">Week totaal</div><div class="value">${importInsights.weeklyMeters?importInsights.weeklyMeters.toLocaleString('nl-BE')+' m':'—'}</div></div>`}

function importResultsHTML(){if(!importRows.length)return `<div class="card"><h2>Voorbeeld van de import</h2><div class="empty">Nog geen trainingssessies gevonden. Upload je PDF of voeg handmatig een training toe.</div>${importRaw?`<button class="btn" onclick="addImportRow()">+ Training toevoegen</button>`:''}</div>`;
const sessions=importRows.filter(r=>r.selected),sum=sessions.reduce((s,r)=>s+(Number(r.meters)||0),0),byZone={};for(const r of sessions){const z=r.zone||'Onbekend';(byZone[z]??={meters:0,count:0}).meters+=Number(r.meters)||0;byZone[z].count++}
return `<div class="card"><div class="cardtop"><h2>🔎 Controleer ${importRows.length} training(en)</h2><span class="small muted">Vooraf controleren</span></div><p class="small muted">De datum komt uit de bovenkant van de trainingspagina; ochtend/avond en trainingscode van boven- of onderaan. Geen verplichte omschrijving. Pas fout herkende gegevens aan.</p><div class="importSummary" style="margin-bottom:14px">${importSummaryTiles()}</div><div class="zoneReport">${Object.entries(byZone).map(([zone,stat])=>`<span><b>${esc(zone)}</b> · ${stat.count} sessie(s) · ${stat.meters.toLocaleString('nl-BE')} m</span>`).join('')}</div><div class="importScroll"><table class="importPreview"><thead><tr><th>✓</th><th>Datum</th><th>Dagdeel</th><th>Start</th><th>Duur (min)</th><th>Meters</th><th>Type</th><th>PDF-pagina</th><th></th></tr></thead><tbody>${importRows.map((r,i)=>`<tr><td><input aria-label="Selecteer training" type="checkbox" ${r.selected?'checked':''} onchange="editImport(${i},'selected',this.checked)"></td><td><input aria-label="Datum" type="date" value="${esc(r.date)}" onchange="editImport(${i},'date',this.value)"></td><td><select aria-label="Dagdeel" onchange="editImport(${i},'period',this.value)"><option value="ochtend" ${r.period==='ochtend'?'selected':''}>Ochtend</option><option value="avond" ${r.period==='avond'?'selected':''}>Avond</option><option value="onbekend" ${r.period==='onbekend'?'selected':''}>Onbekend</option></select></td><td><input aria-label="Starttijd" type="time" value="${esc(r.time)}" onchange="editImport(${i},'time',this.value)"></td><td><input aria-label="Duur" type="number" min="10" max="300" value="${esc(r.duration)}" onchange="editImport(${i},'duration',this.value)"></td><td><input aria-label="Meters" type="number" min="0" max="30000" value="${esc(r.meters??'')}" onchange="editImport(${i},'meters',this.value)"></td><td><select aria-label="Trainingstype" onchange="editImport(${i},'zone',this.value)">${['','AEC1','AEC1+','AEC2','AEC3','ANC','ANP'] async function readPdf(file){await externalScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',()=>!!window.pdfjsLib);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let pages=[];for(let n=1;n<=Math.min(doc.numPages,40);n++){const pg=await doc.getPage(n);let items=(await pg.getTextContent()).items;let lines=[];for(const item of items){let y=Math.round(item.transform[5]/4)*4;let x=item.transform[4];let line=lines.find(l=>Math.abs(l.y-y)<=2);if(!line){line={y,parts:[]};lines.push(line)}line.parts.push({x,text:item.str})}pages.push(lines.sort((a,b)=>b.y-a.y).map(l=>l.parts.sort((a,b)=>a.x-b.x).map(z=>z.text).join(' ')).join('\n'))}return pages}
async function readDocx(file){await externalScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.0/mammoth.browser.min.js',()=>!!window.mammoth);const res=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return res.value}
function extractNumeric(text,min,max){const m=[...String(text||'').matchAll(/\b(\d{1,5})\b/g)].map(x=>Number(x[1])).filter(n=>n>=min&&n<=max);return m.length?m[m.length-1]:null}
function extractMeters(text){const explicit=[...String(text||'').matchAll(/\b(\d{3,5})\s*(?:m|meter|meters)\b/gi)].map(m=>Number(m[1].replace(/\D/g,''))).filter(n=>n>=200&&n<=30000);if(explicit.length)return explicit[explicit.length-1];const bottom=String(text||'').split('\n').slice(-8).join(' ');const nums=[...bottom.matchAll(/\b(\d{3,5})\b/g)].map(m=>Number(m[1])).filter(n=>n>=200&&n<=30000 && n%25===0);if(nums.length)return nums.sort((a,b)=>b-a)[0];return null}
function extractMinutes(text,defaultDuration){const explicit=[...String(text||'').matchAll(/\b(\d{2,3})\s*(?:min|mins|minuten|minute|minutes)\b/gi)].map(m=>Number(m[1])).filter(n=>n>=10&&n<=300);if(explicit.length)return explicit[explicit.length-1];const bottom=String(text||'').split('\n').slice(-8).join(' ');const nums=[...bottom.matchAll(/\b(\d{2,3})\b/g)].map(m=>Number(m[1])).filter(n=>n>=20&&n<=240);if(nums.length)return nums[0];return defaultDuration}
function dayInfoFromText(text){const dayRegex=/\b(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag|ma\.?|di\.?|wo\.?|do\.?|vr\.?|za\.?|zo\.?|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i;const dayMap={maandag:0,'ma.':0,ma:0,monday:0,dinsdag:1,'di.':1,di:1,tuesday:1,woensdag:2,'wo.':2,wo:2,wednesday:2,donderdag:3,'do.':3,do:3,thursday:3,vrijdag:4,'vr.':4,vr:4,friday:4,zaterdag:5,'za.':5,za:5,saturday:5,zondag:6,'zo.':6,zo:6,sunday:6};const hit=String(text||'').match(dayRegex);if(!hit)return null;const key=hit[1].toLowerCase();return {name:hit[1],index:dayMap[key]}}
function firstMeaningfulLine(text){const lines=String(text||'').split('\n').map(x=>x.trim()).filter(Boolean);for(const line of lines){if(line.length<3)continue;if(/^(week|total|totaal|meters|minuten|maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag)$/i.test(line))continue;return line.slice(0,140)}return 'Zwemtraining'}
function extractTimeInfo(text,defaultTime,defaultDuration){const re=/(?:\b|^)([01]?\d|2[0-3])[:.h]([0-5]\d)\s*(?:[-–—tot]+\s*([01]?\d|2[0-3])[:.h]([0-5]\d))?/g;const hits=[...String(text||'').matchAll(re)];if(!hits.length)return {time:defaultTime||'06:00',duration:defaultDuration};const m=hits[0],h=Number(m[1]),min=Number(m[2]);let duration=defaultDuration; if(m[3]!=null){const end=Number(m[3])*60+Number(m[4]);const diff=end-(h*60+min);if(diff>=10&&diff<=300)duration=diff}return {time:String(h).padStart(2,'0')+':'+String(min).padStart(2,'0'),duration}}
function extractPeriod(text){const lines=String(text||'').split('\n').slice(0,12).join(' ');const match=lines.match(/\b(ochtend|avond|morning|evening)\b/i);if(!match)return 'onbekend';return /ochtend|morning/i.test(match[0])?'ochtend':'avond'}
function extractZone(text){const lines=String(text||'').split('\n');const bottom=lines.slice(-18).join(' ');const match=bottom.match(/\b(AEC1\+|AEC[123]|ANC|ANP)\b/i)||String(text||'').match(/\b(AEC1\+|AEC[123]|ANC|ANP)\b/i);return match?match[1].toUpperCase():''}
function parseDateHeader(text,mondayDate){const top=String(text||'').split('\n').slice(0,16).join(' ');let m=top.match(/\b([0-3]?\d)[\/\-.]([01]?\d)[\/\-.](20\d{2})\b/);if(m){const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]);const dt=new Date(y,mo-1,d);if(dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
m=top.match(/\b([0-3]?\d)\s+(januari|februari|maart|april|mei|juni|juli|augustus|september|oktober|november|december)\s+(20\d{2})\b/i);if(m){const months=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];const month=months.indexOf(m[2].toLowerCase())+1;const day=Number(m[1]),year=Number(m[3]);const dt=new Date(year,month-1,day);if(dt.getDate()===day)return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
const info=dayInfoFromText(top);return info?dAdd(mondayDate,info.index):null}
function parseTrainingPages(pages,mondayDate,defaultTime,defaultDuration,coverIsSummary=true){const rows=[];const startIdx=coverIsSummary?1:0;let detectedWeekMeters=null,detectedWeekMinutes=null,lastDay=-1;const dayCounts={};for(let i=0;i<pages.length;i++){const pageText=(pages[i]||'').trim();if(!pageText)continue;if(i===0&&coverIsSummary){detectedWeekMeters=extractMeters(pageText)||extractNumeric(pageText,2000,100000);detectedWeekMinutes=extractMinutes(pageText,null);continue}const dayInfo=dayInfoFromText(pageText);let dayIndex=dayInfo?dayInfo.index:(lastDay>=0?Math.min(lastDay+1,6):Math.max(0,i-startIdx));lastDay=dayIndex;const date=parseDateHeader(pageText,mondayDate)||dAdd(mondayDate,dayIndex),period=extractPeriod(pageText),zone=extractZone(pageText);const count=dayCounts[date]||0;dayCounts[date]=count+1;const inferredTime=period==='avond'?'17:00':period==='ochtend'?'06:00':(count?'17:00':defaultTime);const timeInfo=extractTimeInfo(pageText,inferredTime,defaultDuration);const duration=extractMinutes(pageText,timeInfo.duration);const meters=extractMeters(pageText);rows.push({selected:true,date,period,zone,time:timeInfo.time||inferredTime,duration:Number(duration)||defaultDuration,meters:meters||'',title:(period==='avond'?'Avondtraining':period==='ochtend'?'Ochtendtraining':'Zwemtraining'),page:i+1,rawPreview:pageText.slice(0,1200)})}
importInsights={weeklyMeters:detectedWeekMeters,weeklyMinutes:detectedWeekMinutes,sessionPages:Math.max(0,pages.length-startIdx),detectedMeters:rows.reduce((a,r)=>a+(Number(r.meters)||0),0),detectedMinutes:rows.reduce((a,r)=>a+(Number(r.duration)||0),0)};return rows}
function parseTrainingLines(raw,mondayDate,defaultTime,defaultDuration){const dayRegex=/\b(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag|ma|di|wo|do|vr|za|zo|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i;const dayMap={maandag:0,ma:0,monday:0,dinsdag:1,di:1,tuesday:1,woensdag:2,wo:2,wednesday:2,donderdag:3,do:3,thursday:3,vrijdag:4,vr:4,friday:4,zaterdag:5,za:5,saturday:5,zondag:6,zo:6,sunday:6};const timeRegex=/(?:\b|^)([01]?\d|2[0-3])[:.h]([0-5]\d)\s*(?:[-–—tot]+\s*([01]?\d|2[0-3])[:.h]([0-5]\d))?/g;let day=-1;let seen=new Set();let rows=[];let chunks=raw.replace(/\r/g,'\n').split('\n').map(x=>x.trim()).filter(Boolean);for(const line of chunks){const dayHit=line.match(dayRegex);if(dayHit)day=dayMap[dayHit[1].toLowerCase()];const matches=[...line.matchAll(timeRegex)];if(day<0||!matches.length)continue;for(const m of matches){const hour=Number(m[1]),minute=Number(m[2]);const time=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');let duration=defaultDuration;if(m[3]!=null){const end=Number(m[3])*60+Number(m[4]);const diff=end-(hour*60+minute);if(diff>=10&&diff<=300)duration=diff}const date=dAdd(mondayDate,day);let label=line.replace(dayRegex,'').replace(m[0],'').replace(/^[\s:;|•–-]+|[\s:;|•–-]+$/g,'').trim();if(!label||label.length<3||/^(u|uur|training|zwemmen)$/i.test(label))label='Zwemtraining';const signature=date+'|'+time;if(seen.has(signature))continue;seen.add(signature);rows.push({selected:true,date,time,duration,title:'Zwemtraining',period:'onbekend',zone:extractZone(line),meters:'',page:''})}}importInsights={weeklyMeters:null,weeklyMinutes:null,sessionPages:rows.length,detectedMeters:0,detectedMinutes:rows.reduce((a,r)=>a+(Number(r.duration)||0),0)};return rows}
async function loadTrainingFile(e){const file=e.target.files?.[0];if(!file)return;importFileName=file.name;importRows=[];importRaw='';importPages=[];importInsights={weeklyMeters:null,weeklyMinutes:null,sessionPages:0,detectedMeters:0,detectedMinutes:0};showImportRows();if(file.size>15*1024*1024){importStatus('Bestand te groot: maximaal 15 MB.',true);return}importStatus('Bestand wordt gelezen…');try{const n=file.name.toLowerCase();if(n.endsWith('.pdf')){importPages=await readPdf(file);importRaw=importPages.join('\n\n')}else if(n.endsWith('.docx'))importRaw=await readDocx(file);else if(n.endsWith('.txt'))importRaw=await file.text();else throw Error('Gebruik PDF, DOCX of TXT. Oudere .doc-bestanden eerst opslaan als .docx.');if(!importRaw.trim())throw Error('Geen leesbare tekst gevonden. Mogelijk is dit een gescande PDF.');parseTrainingText()}catch(err){importStatus('Import mislukt: '+err.message,true)}}

function laneDailyScore(date){const tasks=data.tasks.filter(t=>t.date===date);const study=data.events.filter(e=>e.type==='study'&&e.date===date);const priorities=tasks.filter(t=>t.priority==='Hoog');let earned=0,total=0;
 if(tasks.length){total+=40;earned+=40*tasks.filter(t=>t.done&&laneDayISO(t.completedAt)===date).length/tasks.length}

/* LANE 2.9.0: Focus timer is device-local; confirmed sessions use EXISTING events JSON and cloud sync. */
const LANE_FOCUS_STORAGE_PREFIX='lane_focus_timer_v29_';
function laneFocusStoreKey(){return LANE_FOCUS_STORAGE_PREFIX+(cloudUser?.id||'local')}
function laneFocusRead(){try{const s=localStorage.getItem(laneFocusStoreKey());const v=s?JSON.parse(s):null;return v&&v.eventId&&Number.isFinite(v.startedMs)&&Number.isFinite(v.goalMs)?v:null}catch(e){console.warn('LANE focus read:',e);return null}}
function laneFocusWrite(s){try{localStorage.setItem(laneFocusStoreKey(),JSON.stringify(s))}catch(e){alert('De focusstatus kan niet lokaal worden bewaard: '+e.message)}}
function laneFocusClear(){try{localStorage.removeItem(laneFocusStoreKey())}catch(e){console.warn(e)}}
function laneFocusElapsed(f){if(!f)return 0;const live=f.paused?0:Math.max(0,Math.min(Date.now(),f.hardEndAt||Date.now())-(f.runningSince||Date.now()));return Math.max(0,Math.min(f.goalMs,(Number(f.elapsedMs)||0)+live))}
function laneFocusRemaining(f){if(!f)return 0;const byStudy=Math.max(0,f.goalMs-laneFocusElapsed(f));return f.hardEndAt?Math.max(0,Math.min(byStudy,f.hardEndAt-Date.now())):byStudy}
function laneFocusFmt(ms){const sec=Math.max(0,Math.floor(ms/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h>0?`${pad(h)}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`}
function laneFocusTimeNow(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function laneFocusDefaultEnd(){const d=new Date();d.setMinutes(d.getMinutes()+60);return d.toDateString()===new Date().toDateString()?`${pad(d.getHours())}:${pad(d.getMinutes())}`:'23:59'}
function laneFocusFormMode(form){if(!form)return;const until=form.elements.mode?.value==='until';const end=form.querySelector('#l29-end-wrap'),dur=form.querySelector('#l29-duration-wrap');if(end)end.hidden=!until;if(dur)dur.hidden=until}
function laneFocusCheckIdle(){if(laneFocusRead()){alert('Je hebt al een actieve focussessie op dit toestel. Rond die eerst af of annuleer haar.');return false}if(cloudLoadInProgress){alert('LANE is je account nog aan het laden. Probeer het zo opnieuw.');return false}return true}
function laneFocusBeginTimer(e,mode,goalMinutes,hardEndAt){const now=Date.now();const f={version:1,eventId:e.id,startedMs:now,runningSince:now,elapsedMs:0,paused:false,goalMs:hardEndAt?Math.max(1000,hardEndAt-now):Math.round(goalMinutes*60000),mode,hardEndAt:hardEndAt||null,accountId:cloudUser?.id||null};laneFocusWrite(f);render();laneFocusTick()}
function laneFocusCreate(event){event.preventDefault();if(!laneFocusCheckIdle())return;const form=event.target,subjectId=form.elements.subjectId.value,title=form.elements.title.value.trim(),mode=form.elements.mode.value,taskId=form.elements.taskId?.value||'';if(!title||title.length>130){alert('Geef je studiesessie een korte titel.');return}
 const now=new Date(),until=mode==='until';let goalMinutes,hardEndAt=null;
 if(until){const end=form.elements.endTime.value;if(!/^\d{2}:\d{2}$/.test(end)){alert('Kies een geldig einduur.');return}const [h,m]=end.split(':').map(Number);const d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0);hardEndAt=d.getTime();goalMinutes=Math.ceil((hardEndAt-now.getTime())/60000);if(goalMinutes<1||goalMinutes>360){alert('Kies een einduur later vandaag, maximaal 6 uur vanaf nu.');return}}
 else{goalMinutes=Number(form.elements.duration.value);if(!Number.isInteger(goalMinutes)||goalMinutes<5||goalMinutes>360){alert('Kies 5 tot 360 minuten.');return}}
 const due=new Date(now.getTime()+goalMinutes*60000);if(due.toDateString()!==now.toDateString()){alert('Maak voor een sessie over middernacht twee aparte studieblokken.');return}
 const e={id:uid(),title,date:today(),time:laneFocusTimeNow(),endTime:until?form.elements.endTime.value:`${pad(due.getHours())}:${pad(due.getMinutes())}`,duration:String(goalMinutes),type:'study',subjectId,createdAt:now.toISOString(),focusStartedAt:now.toISOString(),focusMode:mode};if(taskId)e.taskId=taskId;
 data.events.push(e);save();laneFocusBeginTimer(e,mode,goalMinutes,hardEndAt);toast('Focussessie gestart ▶');
}
function laneFocusStartPlanned(id){if(!laneFocusCheckIdle())return;const e=data.events.find(x=>x.id===id&&x.type==='study');if(!e||e.completedAt){alert('Dit studieblok is niet beschikbaar.');return}if(e.date!==today()){alert('Start alleen een studiesessie die voor vandaag gepland is.');return}
 const now=Date.now();let endAt=null,mode='duration',mins=Math.min(360,Math.max(5,Number(e.duration)||25));if(e.endTime&&/^\d{2}:\d{2}$/.test(e.endTime)){const [h,m]=e.endTime.split(':').map(Number);const date=new Date();date.setHours(h,m,0,0);if(date.getTime()>now+1000){endAt=date.getTime();mins=Math.ceil((endAt-now)/60000);mode='until'}}
 if(mins>360){alert('Dit blok duurt meer dan 6 uur. Maak een korter focusblok of registreer de studietijd handmatig.');return}
 e.focusMode=mode;e.focusStartedAt=new Date(now).toISOString();save();laneFocusBeginTimer(e,mode,mins,endAt);
}
function laneFocusPause(){const f=laneFocusRead();if(!f||f.paused)return;f.elapsedMs=laneFocusElapsed(f);f.paused=true;f.runningSince=null;laneFocusWrite(f);render()}
function laneFocusResume(){const f=laneFocusRead();if(!f||!f.paused)return;if(laneFocusRemaining(f)===0){alert('De geplande tijd is bereikt. Rond eerst deze studiesessie af.');return}f.paused=false;f.runningSince=Date.now();laneFocusWrite(f);render()}

let cloudDirty=false;
let laneEditSequence=0;
let laneCloudLastConfirmedAt=null;
async function cloudSave(){
 if(!cloudClient||!cloudUser||cloudLoadInProgress)return false;
 if(cloudBusy)return false;
 if(!navigator.onLine){cloudUpdateStatus('Offline: wijzigingen staan alleen op dit apparaat.');return false;}
 cloudBusy=true;const editSequenceAtStart=laneEditSequence;const snapshot=cloudDataSnapshot();
 try{
  const {data:remote,error:readErr}=await cloudClient.from('lane_user_data').select('revision').eq('user_id',cloudUser.id).maybeSingle();
  if(readErr)throw readErr;
  if(remote && Number(remote.revision)!==Number(cloudRevision)){
    laneLocalSafetyCopy(snapshot,'Cloudconflict: andere versie op server');
    cloudUpdateStatus('Synchronisatieconflict! Deze wijzigingen zijn lokaal bewaard. Exporteer een JSON-back-up; niets is overschreven.');
    return false;
  }
  let writeErr=null,changed=null;
  if(remote){
   const response=await cloudClient.from('lane_user_data').update({payload:snapshot,revision:Number(cloudRevision)+1,updated_at:new Date().toISOString()}).eq('user_id',cloudUser.id).eq('revision',cloudRevision).select('revision').maybeSingle();
   writeErr=response.error;changed=response.data;
  }else{
   const response=await cloudClient.from('lane_user_data').insert({user_id:cloudUser.id,payload:snapshot,revision:1}).select('revision').maybeSingle();
   writeErr=response.error;changed=response.data;
  }
  if(writeErr)throw writeErr;
  if(!changed)throw Error('Geen rij gewijzigd; mogelijk synchronisatieconflict.');
  cloudRevision=Number(changed.revision);
  if(laneEditSequence===editSequenceAtStart){cloudDirty=false;laneCloudLastConfirmedAt=new Date().toISOString();cloudUpdateStatus('Cloudopslag bevestigd ✓')}
  else {cloudDirty=true;cloudUpdateStatus('Nieuwe lokale wijzigingen wachten nog op opslag…');setTimeout(()=>{if(cloudDirty&&!cloudBusy)cloudSave()},850)}
  return true;
 }catch(e){cloudDirty=true;laneLocalSafetyCopy(snapshot,'Opslagfout: '+e.message);cloudUpdateStatus('Cloudopslag mislukt (lokaal bewaard): '+e.message);return false}
 finally{cloudBusy=false}
}

async function syncCloudNow(force=false){

 if(force && cloudBusy){cloudUpdateStatus('Cloudopslag is nog bezig, probeer zo opnieuw.');return}
 if(cloudDirty||cloudBusy||cloudWriteTimer){cloudUpdateStatus('Lokale wijzigingen wachten op opslag; cloudgegevens worden niet overgeschreven.');return}
 const {data:row,error}=await cloudClient.from('lane_user_data').select('payload,revision').eq('user_id',cloudUser.id).maybeSingle();
 if(error){cloudUpdateStatus('Cloudlezen mislukt: '+error.message);return}
 if(row?.payload&&Number(row.revision)>Number(cloudRevision)){
  laneLocalSafetyCopy(cloudDataSnapshot(),'Veiligheidskopie voor ophalen nieuwere cloudversie');
  cloudRevision=Number(row.revision);data=row.payload;localStorage.setItem(KEY,JSON.stringify(data));render();cloudUpdateStatus('Nieuwe cloudgegevens geladen ✓')
 } else if(force) cloudUpdateStatus('Cloud is bijgewerkt ✓ Geen nieuwe wijzigingen');
}

async function initCloud(){if(!cloudReady())return;try{if(!window.supabase){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const rawUrl = String(CLOUD_CONFIG.url || '').trim();
    const parsedUrl = new URL(rawUrl);
    if (parsedUrl.protocol !== 'https:' || !parsedUrl.hostname.endsWith('.supabase.co')) {
      throw new Error('Ongeldige Supabase project-URL in config.js');
    }
    // Prevent accidental use of a REST/Auth endpoint instead of the project base URL.
    const projectUrl = parsedUrl.origin;
    if (rawUrl.replace(/\/+$/, '') !== projectUrl) {
      console.warn('LANE: project-URL bevat een pad; gebruik uitsluitend de Supabase basis-URL.');
    }
    // Normalize legacy doubled REST prefixes for both Auth and database requests.
    // The native fetch still handles credentials, CORS and Supabase session tokens.
    const nativeFetch = window.fetch.bind(window);
    const laneFetch = (input, options) => {
      const rawRequestUrl = typeof input === 'string' ? input : input.url;
      const correctedUrl = rawRequestUrl.replace(/(\/rest\/v1){2,}(?=\/)/g, '/rest/v1');
      const request = correctedUrl === rawRequestUrl
        ? input
        : (typeof input === 'string' ? correctedUrl : new Request(correctedUrl, input));
      return nativeFetch(request, options);
    };
    cloudClient = window.supabase.createClient(projectUrl, CLOUD_CONFIG.anonKey, {
      global: { fetch: laneFetch },
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    if (cloudClient.auth?.url && !cloudClient.auth.url.startsWith(projectUrl + '/auth/v1')) {
      throw new Error('Supabase Auth endpoint is ongeldig: ' + cloudClient.auth.url);
