dius:30px;background:linear-gradient(90deg,#35c2c2,#8d8bff);transition:width .2s}.recovery{display:grid;grid-template-columns:1fr 1fr;gap:12px}.recovery .tile{background:#1b2940;padding:16px;border-radius:13px}.tile b{display:block;font:700 25px 'Outfit';margin:7px 0}.tile span{font-size:12px;color:#a9b8d0}.sectionbar{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:20px 0 15px;flex-wrap:wrap}.sectionbar h2{font:600 20px 'Outfit';margin:0}.inputrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#b7c4da;font-weight:700}.field input,.field select,.field textarea{background:#0d1728;border:1px solid #34445d;color:#f2f6ff;border-radius:10px;padding:12px;min-width:0}.field textarea{resize:vertical;min-height:75px}.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.listcard{padding:12px 21px}.rowitem{padding:14px 0;border-bottom:1px solid #2a3650;display:flex;justify-content:space-between;gap:12px;align-items:center}.rowitem:last-child{border:0}.subheading{font-weight:800;color:#d8e5fa}.miniBtn{border:0;background:#293953;border-radius:8px;color:#c6d4e8;padding:6px 9px;font-size:12px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.training{border-top:3px solid var(--cyan)}.training h3{font:600 17px 'Outfit';margin:9px 0}.training p{color:#bac8da;font-size:13px;line-height:1.5}.training .dist{font:700 28px 'Outfit';color:var(--cyan)}.training .meta{display:flex;justify-content:space-between;color:#90a3be;font-size:12px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{background:#1b2940;padding:13px 7px;border:1px solid #293852;border-radius:12px;text-align:center;min-width:0}.day strong{display:block;color:#f1f5ff;font-size:18px;margin:10px 0 4px}.day small{color:#97a9c2;font-size:11px}.day.today{border-color:var(--cyan)}.day .dot{height:6px;background:#44536b;border-radius:20px;margin const KEY='lane_os_v1';const pad=n=>String(n).padStart(2,'0');const toLocalDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const today=()=>toLocalDate(new Date());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,6);const dayName=d=>new Date(d+'T12:00:00').toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'});const dAdd=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return toLocalDate(x)};const initial=()=>({name:'Noa',tasks:[],events:[],swims:[],wellness:[],subjects:[{id:uid(),name:'Programmeren',color:'#a598ff'},{id:uid(),name:'Databanken',color:'#56e4db'},{id:uid(),name:'Webdevelopment',color:'#ffcc78'}],goalSessions:8,goalStudy:12,focus:25});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}for(const key of ['tasks','events','swims','wellness','subjects'])if(!Array.isArray(data[key]))data[key]=[];if(!data.athlete){data.athlete={vo2max:79.6, vlamax:0.73, main:'200 m schoolslag', secondary:'400 m wisselslag', club:'BRABO Kernploeg', sessions:8, weeklyKm:40, personalBests:[['50 school (25m)','29,86'],['100 school (25m)','1:04,96'],['200 school (25m)','2:16,19'],['200 school (50m)','2:19,30'],['400 wissel (25m)','4:38,42'],['400 wissel (50m)','4:35,24']],splits:['31,48','35,82','36,15','35,85']};try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn(e)}}let page='dashboard';const nav=[['dashboard','◈','Dashboard'],['planning','▦','Planning'],['tasks','✓','Taken'],['swimming','≋','Zwemmen'],['performance','◉','Performance'],['study','⌘','Studie'],['recovery','♡','Herstel'],['settings','⚙','Instellingen']];const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)};const monday=()=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return toLocalDate(d)};const weekDates=()=>Array.from({length:7},(_,i)=>dAdd(monday(),i));const withinWeek=date=>date>=monday()&&date<=dAdd(monday(),6);const swimWeek=()=>data.swims.filter(x=>withinWeek(x.date));const studyWeek=()=>data.events.filter(x=>x.type==='study'&&withinWeek(x.date)).reduce((a,x)=>a+(Number(x.duration)||0)/60,0);const dueTasks=()=>data.tasks.filter(t=>!t.done&&t.date<=today()).sort((a,b)=>a.date.localeCompare(b.date));const completion=()=>data.tasks.length?Math.round(data.tasks.filter(t=>t.done).length/data.tasks.length*100):0;const latestRecovery=()=>[...data.wellness].sort((a,b)=>b.date.localeCompare(a.date))[0];const eRows=(items,limit=20)=>items.slice(0,limit).map(e=>`<div class="scheduleitem ${e.type==='study'?'study':e.type==='other'?'other':''}"><span class="time">${esc(e.time||'—')}</span><div><div class="itemtitle">${esc(e.title)}</div><div class="itemsub">${e.type==='swim'?'🏊 Zwemmen':e.type==='study'?'📚 Studie':'📍 Overig'}${e.duration?' · '+esc(e.duration)+' min':''}${e.location?' · '+esc(e.location):''}</div></div></div>`).join('');const sortedEvents=()=>[...data.events].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));function setPage(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){const dateLabel=new Date().toLocaleDateString('nl-BE',{day:'numeric',month:'short',year:'numeric'});document.getElementById('todayDate').textContent='◷ '+dateLabel;document.getElementById('subtitle').textContent=page==='dashboard'?'Eén plek voor prestaties, focus en balans.':'Maak elke dag een beetje sterker.';const names={dashboard:'Vandaag op koers.',planning:'Jouw planning.',tasks:'Actie geeft momentum.',swimming:'Train met intentie.',performance:'Jouw performance lab.',study:'Bouw aan je toekomst.',recovery:'Herstel is progressie.',settings:'Jouw cockpit.'};document.getElementById('pagetitle').textContent=names[page];document.getElementById('eyebrow').textContent=page==='dashboard'?'JOUW COMMAND CENTER':nav.find(n=>n[0]===page)[2].toUpperCase();for(const [id,el] of [['desktopNav',''],['mobileNav','']])document.getElementById(id).innerHTML=nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="setPage('${n[0]}')"><span class="${id==='desktopNav'?'ico':''}">${n[1]}</span>${n[2]}</button>`).join('');document.getElementById('content').innerHTML=({dashboard,planning,tasks,swimming,performance,study,recovery,settings})[page]()}function dashboard(){const events=sortedEvents().filter(e=>e.date===today());const pending=data.tasks.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date));const rec=latestRecovery();return `<div class="grid metrics"><div class="card"><div class="statlabel">🏊 Zwemsessies deze week</div><div class="statvalue cyan">${swimWeek().length}<span style="font-size:16px;color:#8fa0bb"> / ${data.goalSessions}</span></div><div class="statfoot">${swimWeek().reduce((a,x)=>a+Number(x.distance),0).toLocaleString('nl-BE')} meter gezwommen</div></div><div class="card"><div class="statlabel">📚 Studie deze week</div><div class="statvalue purple">${studyWeek().toFixed(1).replace('.',',')}<span style="font-size:16px;color:#8fa0bb"> u</span></div><div class="statfoot">Weekdoel: ${data.goalStudy} uur (geplande blokken)</div></div><div class="card"><div class="statlabel">✅ Taken afgerond</div><div class="statvalue">${completion()}%</div><div class="statfoot">${data.tasks.filter(x=>x.done).length} van ${data.tasks.length} totaal</div></div><div class="card"><div class="statlabel">⚡ Openstaande deadlines</div><div class="statvalue yellow">${dueTasks().length}</div><div class="statfoot">Vandaag of achterstallig</div></div></div><div class="grid twocol"><div class="card"><div class="cardtop"><h2>📅 Vandaag · ${esc(dayName(today()))}</h2><button class="miniBtn" onclick="openForm('event')">+ Blok</button></div>${events.length?eRows(events):'<div class="empty">Nog geen blokken gepland. Plan je eerste trainings- of studiesessie.</div>'}</div><div class="card"><div class="cardtop"><h2>🎯 Eerstvolgende taken</h2><button class="miniBtn" onclick="openForm('task')">+ Taak</button></div>${pending.length?taskRows(pending.slice(0,6)):'<div class="empty">Alles afgevinkt of nog geen taken toegevoegd.</div>'}<div class="progress"><div style="width:${completion()}%"></div></div></div></div><div class="grid twocol" style="margin-top:17px"><div class="card"><div class="cardtop"><h2>📈 Je week in één oogopslag</h2><span class="small muted">ma–zo</span></div>${weekStrip()}<div class="note" style="margin-top:18px">💡 <b>Consistency beats intensity.</b> Een haalbare planning met ruimte voor herstel is sterker dan een volle agenda.</div></div><div class="card"><div class="cardtop"><h2>🫀 Herstelcheck</h2><button class="miniBtn" onclick="openForm('wellness')">+ Check-in</button></div>${rec?`<div class="recovery"><div class="tile"><span>Slaap (laatste check-in)</span><b>${esc(rec.sleep)} u</b></div><div class="tile"><span>Energie</span><b>${esc(rec.energy)}/10</b></div><div class="tile"><span>Spiervermoeidheid</span><b>${esc(rec.soreness)}/10</b></div><div class="tile"><span>Stress</span><b>${esc(rec.stress)}/10</b></div></div><p class="small muted">Geregistreerd op ${esc(dayName(rec.date))}</p>`:'<div class="empty">Hoe voel je je vandaag? Leg je slaap, energie en herstel vast.</div>'}</div></div>`}function weekStrip(){return `<div class="week">${weekDates().map(d=>{const count=data.events.filter(x=>x.date===d).length+data.swims.filter(x=>x.date===d).length;return `<div class="day ${d===today()?'today':''}"><small>${new Date(d+'T12:00:00').toLocaleDateString('nl-BE',{weekday:'short'})}</small><strong>${d.slice(8)}</strong><small>${count} item${count===1?'':'s'}</small><div class="dot ${count?'filled':''}"></div></div>`}).join('')}</div>`}function taskRows(items){return items.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="Taak afronden" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div style="flex:1"><div class="itemtitle">${esc(t.title)}<span class="chip">${esc(t.category)}</span></div><div class="taskmeta">${esc(dayName(t.date))} · ${esc(t.priority)} prioriteit</div></div><button class="miniBtn" title="Verwijderen" onclick="removeItem('tasks','${t.id}')">✕</button></div>`).join('')}function planning(){const days=weekDates();return `<div class="sectionbar"><h2>Weekoverzicht</h2><button class="btn primary" onclick="openForm('event')">+ Plan een blok</button></div><div class="card">${weekStrip()}</div><div class="sectionbar"><h2>Alle geplande blokken</h2></div><div class="card listcard">${sortedEvents().length?sortedEvents().map(e=>`<div class="rowitem"><div><span class="subheading">${esc(e.title)}</span><div class="itemsub">${esc(dayName(e.date))} · ${esc(e.time)} · ${esc(e.type)}${e.duration?' · '+esc(e.duration)+' min':''}</div></div><button class="miniBtn" onclick="removeItem('events','${e.id}')">Verwijder</button></div>`).join(''):'<div class="empty">Nog niets gepland.</div>'}</div>`}function tasks(){const active=[...data.tasks].sort((a,b)=>a.done-b.done||a.date.localeCompare(b.date));return `<div class="sectionbar"><h2>${data.tasks.filter(t=>!t.done).length} openstaande taken</h2><button class="btn primary" onclick="openForm('task')">+ Nieuwe taak</button></div><div class="grid twocol"><div class="card"><h2>Jouw actielijst</h2>${active.length?taskRows(active):'<div class="empty">Voeg je eerste taak toe. Start klein.</div>'}</div><div class="card"><h2>Taakvoortgang</h2><div class="statvalue cyan">${completion()}%</div><p class="muted">Afgerond over alle taken</p><div class="progress"><div style="width:${completion()}%"></div></div><p class="small muted">Tip: kies dagelijks maximaal drie belangrijke taken.</p></div></div>`}function swimming(){const total=data.swims.reduce((a,x)=>a+Number(x.distance),0);const swims=[...data.swims].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="grid metrics"><div class="card"><div class="statlabel">Deze week</div><div class="statvalue cyan">${swimWeek().length}</div><div class="statfoot">sessies</div></div><div class="card"><div class="statlabel">Deze week</div><div class="statvalue">${swimWeek().reduce((a,x)=>a+Number(x.distance),0).toLocaleString('nl-BE')}</div><div class="statfoot">meters</div></div><div class="card"><div class="statlabel">Totaal gelogd</div><div class="statvalue purple">${total.toLocaleString('nl-BE')}</div><div class="statfoot">meters</div></div><div class="card"><div class="statlabel">Gemiddelde RPE</div><div class="statvalue yellow">${data.swims.length?(data.swims.reduce((a,x)=>a+Number(x.rpe),0)/data.swims.length).toFixed(1):'—'}</div><div class="statfoot">ervaren inspanning /10</div></div></div><div class="sectionbar"><h2>Trainingslogboek</h2><button class="btn primary" onclick="openForm('swim')">+ Log training</button></div><div class="grid three">${swims.length?swims.map(s=>`<div class="card training"><div class="meta"><span>${esc(dayName(s.date))}</span><span>RPE ${esc(s.rpe)}/10</span></div><h3>${esc(s.type)}</h3><div class="dist">${Number(s.distance).toLocaleString('nl-BE')} m</div><p>${esc(s.notes||'Geen notities toegevoegd.')}</p><button class="miniBtn" onclick="removeItem('swims','${s.id}')">Verwijderen</button></div>`).join(''):'<div class="card"><div class="empty">Log je eerste training om patronen en belasting te volgen.</div></div>'}</div><div class="note" style="margin-top:17px">RPE = jouw ervaren inspanning op een schaal van 1 (zeer licht) tot 10 (maximaal). Deze app geeft geen medisch of sportwetenschappelijk hersteladvies.</div>`}function study(){const subjects=data.subjects;return `<div class="grid twocol"><div class="card"><div class="cardtop"><h2>Studieblokken</h2><button class="miniBtn" onclick="openForm('event','study')">+ Studieblok</button></div><div class="statvalue purple">${studyWeek().toFixed(1).replace('.',',')} u</div><div class="statfoot">gepland deze week · doel ${data.goalStudy} u</div><div class="progress"><div style="width:${Math.min(100,studyWeek()/Math.max(1,data.goalStudy)*100)}%"></div></div><div style="margin-top:18px">${sortedEvents().filter(e=>e.type==='study').length?sortedEvents().filter(e=>e.type==='study').map(e=>`<div class="rowitem"><div><b>${esc(e.title)}</b><div class="itemsub">${esc(dayName(e.date))} · ${esc(e.duration||0)} min</div></div></div>`).join(''):'<div class="empty">Plan een geconcentreerd studieblok.</div>'}</div></div><div class="card"><div class="cardtop"><h2>Vakken</h2><button class="miniBtn" onclick="openForm('subject')">+ Vak</button></div>${subjects.map(s=>`<div class="rowitem"><div style="display:flex;gap:11px;align-items:center"><span style="width:10px;height:10px;background:${esc(s.color||'#56e4db')};border-radius:50%"></span><b>${esc(s.name)}</b></div><button class="miniBtn" onclick="removeItem('subjects','${s.id}')">✕</button></div>`).join('')||'<div class="empty">Voeg een vak toe.</div>'}<div class="note" style="margin-top:15px">🎓 Plan studeerblokken rond je trainingen, en geef zware leerstof een plek wanneer je mentaal scherp bent.</div></div></div><div class="sectionbar"><h2>Focusstrategie</h2></div><div class="grid three"><div class="card"><h2>01 · Kies</h2><p class="muted">Kies één concrete opdracht voor je studiesessie.</p></div><div class="card"><h2>02 · Focus</h2><p class="muted">Werk 25–50 minuten zonder meldingen of multitasking.</p></div><div class="card"><h2>03 · Herhaal</h2><p class="muted">Test jezelf kort met active recall.</p></div></div>`}function recovery(){const logs=[...data.wellness].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="sectionbar"><h2>Dagelijkse check-ins</h2><button class="btn primary" onclick="openForm('wellness')">+ Check-in</button></div><div class="grid twocol"><div class="card"><h2>Hoe voel je je?</h2><p class="muted">Leg kort slaap, energie, spiervermoeidheid en stress vast. Kijk naar trends, niet naar één momentopname.</p>${logs.length?logs.map(x=>`<div class="rowitem"><div><b>${esc(dayName(x.date))}</b><div class="itemsub">Slaap ${esc(x.sleep)}u · Energie ${esc(x.energy)}/10 · Spiervermoeidheid ${esc(x.soreness)}/10 · Stress ${esc(x.stress)}/10</div>${x.notes?`<div class="itemsub">${esc(x.notes)}</div>`:''}</div><button class="miniBtn" onclick="removeItem('wellness','${x.id}')">✕</button></div>`).join(''):'<div class="empty">Nog geen check-ins.</div>'}</div><div class="card"><h2>Herstelprincipes</h2><div class="tips"><span>🌙</span><div><b>Slaapritme</b><br>Streef naar een consistent slaap- en waakmoment dat bij je trainingsschema past.</div></div><div class="tips"><span>🍽️</span><div><b>Brandstof</b><br>Plan genoeg tijd voor eten en drinken rondom trainingen en colleges.</div></div><div class="tips"><span>🧠</span><div><b>Mentale belasting</b><br>Houd rekening met examens, deadlines en reizen naast fysieke inspanning.</div></div><div class="tips"><span>💬</span><div><b>Bespreek signalen</b><br>Bij aanhoudende vermoeidheid of klachten: overleg met je coach of zorgverlener.</div></div></div></div>`}function performance(){const a=data.athlete||{};const prs=a.personalBests||[];const splits=a.splits||[];const v=Number(a.vo2max);const l=Number(a.vlamax);return `<div class="heroPerform"><div class="eyebrow">ATLETEPROFIEL · BRABO KERNPLOEG</div><h2>Every length counts.</h2><p>Prestatiegegevens uit onze eerdere analyse. Handmatig aanpasbaar; geen automatische synchronisatie met sporthorloge of trainingssoftware.</p><div class="heroBadges"><span>🏊 ${esc(a.main||'200 m schoolslag')}</span><span>⚡ ${esc(a.secondary||'400 m wisselslag')}</span><span>📅 7–8 november · Vlaams kampioenschap KB</span></div></div><div class="grid metrics"><div class="card"><div class="statlabel">VO₂max · gemeten waarde</div><div class="statvalue cyan">${Number.isFinite(v)?v.toLocaleString('nl-BE'):'—'}</div><div class="statfoot">Eenheid / testprotocol niet bevestigd</div></div><div class="card"><div class="statlabel">VLamax · gemeten waarde</div><div class="statvalue purple">${Number.isFinite(l)?l.toLocaleString('nl-BE'):'—'}</div><div class="statfoot">Eenheid / testprotocol niet bevestigd</div></div><div class="card"><div class="statlabel">Typisch volume</div><div class="statvalue">${esc(a.weeklyKm||40)} <span style="font-size:16px">km</span></div><div class="statfoot">± ${esc(a.sessions||8)} zwemsessies per week</div></div><div class="card"><div class="statlabel">Primair doel</div><div class="statvalue yellow" style="font-size:24px">200 school</div><div class="statfoot">Korte baan / lange baan</div></div></div><div class="grid twocol"><div class="card"><div class="cardtop"><h2>🏅 Persoonlijke records</h2><span class="small muted">Op basis van eerder gesprek</span></div>${prs.map(p=>`<div class="rowitem"><div class="subheading">${esc(p[0])}</div><b style="color:var(--cyan)">${esc(p[1])}</b></div>`).join('')}</div><div class="card"><h2>📊 Analyse 200 m schoolslag</h2><p class="muted small">Eerder gedeelde 50 m-tussentijden. Controleer zelf of deze bij de juiste wedstrijd horen.</p><div class="splitChart">${splits.map((s,i)=>`<div class="splitRow"><span>${i+1}e 50</span><div class="barTrack"><div class="barFill" style="width:${Math.min(100,parseFloat(s.replace(',','.'))/40*100)}%"></div></div><b>${esc(s)} s</b></div>`).join('')}</div><div class="note">De derde 50 m verdient aandacht bij wedstrijdanalyse. Gebruik splits samen met je eigen gevoel en feedback van je trainer; er volgt hier geen automatische fysiologische diagnose uit.</div></div></div><div class="grid twocol" style="margin-top:17px"><div class="card"><h2>🏁 Wedstrijdweek · 7–8 november</h2><div class="scheduleitem"><span class="time">Za 7</span><div><div class="itemtitle">400 m wisselslag</div><div class="itemsub">Voorrondes en mogelijke finale</div></div></div><div class="scheduleitem"><span class="time">Zo 8</span><div><div class="itemtitle">200 m schoolslag</div><div class="itemsub">Voorrondes en mogelijke finale</div></div></div><p class="small muted">Dit is wedstrijdcontext, geen definitief startuur of officiële inschrijving.</p></div><div class="card"><h2>⚙️ Profiel bijwerken</h2><form class="inputrow" onsubmit="saveAthlete(event)"><label class="field">VO₂max<input name="vo2max" type="number" step="0.01" min="0" value="${esc(a.vo2max)}"></label><label class="field">VLamax<input name="vlamax" type="number" step="0.01" min="0" value="${esc(a.vlamax)}"></label><label class="field">Trainingen / week<input name="sessions" type="number" min="0" max="30" value="${esc(a.sessions)}"></label><label class="field">Gem. km / week<input name="weeklyKm" type="number" min="0" max="200" step="0.5" value="${esc(a.weeklyKm)}"></label><div class="full formactions"><button class="btn primary" type="submit">Bewaar profiel</button></div></form></div></div>`}function saveAthlete(e){e.preventDefault();const f=new FormData(e.target);for(const k of ['vo2max','vlamax','sessions','weeklyKm'])data.athlete[k]=Number(f.get(k));save();toast('Performanceprofiel bewaard')}function settings(){return `<div class="grid twocol"><div class="card"><h2>Persoonlijke doelen</h2><form onsubmit="saveSettings(event)" class="inputrow"><label class="field full">Naam<input id="sname" value="${esc(data.name)}" required maxlength="40"></label><label class="field">Zwemsessies per week<input id="sswim" type="number" min="0" max="30" value="${data.goalSessions}" required></label><label class="field">Studie-uren per week<input id="sstudy" type="number" min="0" max="100" value="${data.goalStudy}" required></label><div class="full formactions"><button class="btn primary" type="submit">Wijzigingen bewaren</button></div></form></div><div class="card"><h2>Gegevens & privacy</h2><p class="muted">LANE bewaart alles in de lokale opslag van deze browser. Er is geen account of server. Andere apparaten synchroniseren niet automatisch.</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="exportData()">↓ Exporteer JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">↑ Importeer JSON</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><p class="small muted">Maak regelmatig een back-up; browsergegevens kunnen worden gewist.</p><button class="btn" style="color:#ffafb9" onclick="resetData()">Wis alle gegevens</button></div></div>`}function closeModal(){document.getElementById('modal').classList.add('hidden')}function openForm(kind,preType){const configs={task:['Nieuwe taak',`<label class="field full">Taak<input name="title" required maxlength="130" placeholder="bv. Project Java afronden"></label><label class="field">Deadline<input name="date" type="date" value="${today()}" required></label><label class="field">Categorie<select name="category"><option>Studie</option><option>Sport</option><option>Persoonlijk</option></select></label><label class="field full">Prioriteit<select name="priority"><option>Hoog</option><option selected>Middel</option><option>Laag</option></select></label>`],event:['Plan een blok',`<label class="field full">Activiteit<input name="title" required maxlength="130" placeholder="bv. Ochtendtraining / Databanken"></label><label class="field">Datum<input name="date" type="date" value="${today()}" required></label><label class="field">Starttijd<input name="time" type="time" value="08:00" required></label><label class="field">Type<select name="type"><option value="swim" ${preType==='study'?'':'selected'}>Zwemtraining</option><option value="study" ${preType==='study'?'selected':''}>Studie</option><option value="other">Overig</option></select></label><label class="field">Duur (min)<input name="duration" type="number" min="1" max="1440" value="60" required></label><label class="field full">Locatie (optioneel)<input name="location" maxlength="100" placeholder="Campus / zwembad"></label>`],swim:['Log een zwemtraining',`<label class="field">Datum<input name="date" type="date" value="${today()}" required></label><label class="field">Trainingstype<select name="type"><option>Techniek</option><option>Aeroob</option><option>Snelheid</option><option>Drempel</option><option>Wedstrijd</option><option>Herstel</option><option>Kracht / droogtraining</option></select></label><label class="field">Afstand (meters)<input name="distance" type="number" min="0" max="30000" required placeholder="4500"></label><label class="field">RPE (1–10)<input name="rpe" type="number" min="1" max="10" value="6" required></label><label class="field full">Notities<textarea name="notes" maxlength="700" placeholder="Sets, tempo's, gevoel, feedback coach..."></textarea></label>`],wellness:['Dagelijkse herstelcheck',`<label class="field">Datum<input name="date" type="date" value="${today()}" required></label><label class="field">Slaap (uren)<input name="sleep" type="number" min="0" max="24" step="0.5" value="8" required></label><label class="field">Energie (1–10)<input name="energy" type="number" min="1" max="10" value="7" required></label><label class="field">Spiervermoeidheid (1–10)<input name="soreness" type="number" min="1" max="10" value="3" required></label><label class="field">Stress (1–10)<input name="stress" type="number" min="1" max="10" value="3" required></label><label class="field full">Notities<textarea name="notes" maxlength="500" placeholder="Wat beïnvloedde je herstel?"></textarea></label>`],subject:['Nieuw vak',`<label class="field full">Naam vak<input name="name" required maxlength="70" placeholder="bv. Algoritmen en datastructuren"></label>`]};const conf=configs[kind];document.getElementById('modalContent').innerHTML=`<h2>${conf[0]}</h2><form id="addForm" onsubmit="submitForm(event,'${kind}')"><div class="inputrow">${conf[1]}</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Annuleren</button><button type="submit" class="btn primary">Opslaan</button></div></form>`;document.getElementById('modal').classList.remove('hidden');document.querySelector('#addForm input')?.focus()}function submitForm(evt,kind){evt.preventDefault();const obj=Object.fromEntries(new FormData(evt.target).entries());obj.id=uid();if(kind==='task'){obj.done=false;data.tasks.push(obj)}if(kind==='event')data.events.push(obj);if(kind==='swim')data.swims.push(obj);if(kind==='wellness'){data.wellness=data.wellness.filter(x=>x.date!==obj.date);data.wellness.push(obj)}if(kind==='subject'){obj.color=['#a598ff','#56e4db','#ffcc78','#ff8e9d'][data.subjects.length%4];data.subjects.push(obj)}closeModal();save();toast('Opgeslagen ✓')}function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save()}function removeItem(list,id){if(!confirm('Dit item verwijderen?'))return;data[list]=data[list].filter(x=>x.id!==id);save();toast('Verwijderd')}function saveSettings(e){e.preventDefault();data.name=document.getElementById('sname').value;data.goalSessions=Number(document.getElementById('sswim').value);data.goalStudy=Number(document.getElementById('sstudy').value);save();toast('Instellingen bijgewerkt')}function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`lane-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(evt){const file=evt.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const incoming=parsed.data||parsed;if(!Array.isArray(incoming.tasks)||!Array.isArray(incoming.events)||!Array.isArray(incoming.swims)||!Array.isArray(incoming.wellness)||!Array.isArray(incoming.subjects))throw Error('Ongeldig bestand');if(!confirm('Dit vervangt alle huidige gegevens. Doorgaan?'))return;data=incoming;save();toast('Back-up geïmporteerd')}catch(e){alert('Import mislukt: '+e.message)}}function resetData(){if(confirm('Alle gegevens definitief uit deze browser verwijderen? Maak eventueel eerst een back-up.')){data=initial();save();toast('Opnieuw begonnen')}}document.getElementById('exportBtn').onclick=exportData;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);</script></body></html>
